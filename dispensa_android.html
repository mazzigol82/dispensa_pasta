<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestione Dispensa Pasta</title>
    <!-- Tailwind CSS per la grafica -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-amber-50 text-slate-800 min-h-screen p-4 md:p-8">

    <div class="max-w-5xl mx-auto">
        <!-- Header -->
        <header class="text-center mb-8">
            <h1 class="text-3xl md:text-4xl font-bold text-amber-700">🍝 La Mia Dispensa Pasta</h1>
            <p class="text-slate-600 mt-2">Tieni traccia delle scorte, scadenze multiple e lotti diversi</p>
            
            <!-- SEZIONE BACKUP & RIPRISTINO -->
            <div class="mt-4 flex justify-center items-center gap-3">
                <button onclick="esportaBackup()" class="bg-amber-700 hover:bg-amber-800 text-white text-xs font-semibold px-3 py-2 rounded-lg shadow transition flex items-center gap-1.5">
                    📥 Esporta Backup (JSON)
                </button>
                <label class="bg-white hover:bg-slate-100 text-amber-800 border border-amber-300 text-xs font-semibold px-3 py-2 rounded-lg shadow transition cursor-pointer flex items-center gap-1.5">
                    📤 Ripristina Backup
                    <input type="file" id="importFile" accept=".json" onchange="importaBackup(event)" class="hidden">
                </label>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            
            <!-- FORM DI INSERIMENTO / MODIFICA -->
            <div class="bg-white p-6 rounded-2xl shadow-md border border-amber-200 h-fit sticky top-4">
                <div class="flex justify-between items-center mb-4">
                    <h2 id="formTitle" class="text-xl font-bold text-amber-800">Aggiungi Pasta</h2>
                    <button id="cancelEditBtn" onclick="annullaModifica()" class="hidden text-xs bg-slate-200 hover:bg-slate-300 px-2 py-1 rounded text-slate-700 font-semibold">Annulla</button>
                </div>

                <form id="pastaForm" class="space-y-4">
                    <input type="hidden" id="editIndex" value="-1">

                    <div>
                        <label class="block text-sm font-medium mb-1">Tipo di Pasta (es. Spaghetti, Penne)</label>
                        <input type="text" id="tipo" required placeholder="Es. Rigatoni" 
                            class="w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-amber-500 focus:outline-none">
                    </div>

                    <div>
                        <label class="block text-sm font-medium mb-1">Marca</label>
                        <input type="text" id="marca" required placeholder="Es. Barilla, De Cecco" 
                            class="w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-amber-500 focus:outline-none">
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-sm font-medium mb-1">Quantità (Pacchi)</label>
                            <input type="number" id="quantita" min="1" value="1" required 
                                class="w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-amber-500 focus:outline-none">
                        </div>
                        <div>
                            <label class="block text-sm font-medium mb-1">Scadenza</label>
                            <input type="date" id="scadenza" required 
                                class="w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-amber-500 focus:outline-none">
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-medium mb-1">Foto del Prodotto (Opzionale)</label>
                        <input type="file" id="foto" accept="image/*" 
                            class="w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:bg-amber-100 file:text-amber-700 hover:file:bg-amber-200">
                    </div>

                    <div class="flex items-center gap-2 pt-2">
                        <input type="checkbox" id="integrale" class="w-5 h-5 text-amber-600 rounded focus:ring-amber-500">
                        <label for="integrale" class="text-sm font-medium text-slate-700">È pasta integrale? 🌾</label>
                    </div>

                    <button type="submit" id="submitBtn"
                        class="w-full bg-amber-600 hover:bg-amber-700 text-white font-semibold py-3 rounded-lg transition duration-200 shadow">
                        Aggiungi alla Dispensa
                    </button>
                </form>
            </div>

            <!-- LISTA DELLA PASTA -->
            <div class="lg:col-span-2 space-y-4">
                
                <!-- TAB DI FILTRAGGIO & BARRA DI RICERCA -->
                <div class="bg-white p-4 rounded-xl shadow border border-amber-100 space-y-3">
                    <div class="flex flex-wrap justify-between items-center gap-2">
                        <!-- TAB -->
                        <div class="flex gap-1 bg-amber-50 p-1 rounded-lg border border-amber-200 text-sm">
                            <button onclick="setTab('tutti')" id="tab-tutti" class="tab-btn px-3 py-1.5 rounded-md font-semibold bg-white text-amber-800 shadow-sm">Tutti</button>
                            <button onclick="setTab('standard')" id="tab-standard" class="tab-btn px-3 py-1.5 rounded-md font-semibold text-slate-600 hover:text-amber-800">Standard</button>
                            <button onclick="setTab('integrale')" id="tab-integrale" class="tab-btn px-3 py-1.5 rounded-md font-semibold text-slate-600 hover:text-amber-800">🌾 Integrali</button>
                        </div>
                        <span class="text-sm font-semibold text-amber-800">Totale pacchi: <span id="countPacchi">0</span></span>
                    </div>

                    <!-- RICERCA -->
                    <input type="text" id="searchBar" oninput="aggiornaUI()" placeholder="🔍 Cerca per tipo o marca..." 
                        class="w-full p-2 border rounded-lg text-sm focus:ring-2 focus:ring-amber-500 focus:outline-none">
                </div>
                
                <!-- CONTAINER LISTA CARDS -->
                <div id="pastaList" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <!-- Cards inserite qui dinamicamente -->
                </div>
            </div>

        </div>
    </div>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        let dispensa = JSON.parse(localStorage.getItem('dispensa_pasta')) || [];
        let currentTab = 'tutti';

        // Migrazione struttura dati vecchia (se presente)
        dispensa = dispensa.map(item => {
            if (!item.lotti) {
                return {
                    tipo: item.tipo,
                    marca: item.marca,
                    integrale: item.integrale,
                    foto: item.foto,
                    lotti: [{ scadenza: item.scadenza, quantita: Number(item.quantita || 1) }]
                };
            }
            return item;
        });

        const pastaForm = document.getElementById('pastaForm');
        const pastaList = document.getElementById('pastaList');
        const countPacchiSpan = document.getElementById('countPacchi');
        const formTitle = document.getElementById('formTitle');
        const submitBtn = document.getElementById('submitBtn');
        const cancelEditBtn = document.getElementById('cancelEditBtn');
        const editIndexInput = document.getElementById('editIndex');

        function setTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('bg-white', 'text-amber-800', 'shadow-sm');
                btn.classList.add('text-slate-600');
            });

            const activeBtn = document.getElementById(`tab-${tab}`);
            activeBtn.classList.add('bg-white', 'text-amber-800', 'shadow-sm');
            activeBtn.classList.remove('text-slate-600');

            aggiornaUI();
        }

        function calcolaTotalePacchi(item) {
            return item.lotti.reduce((acc, l) => acc + Number(l.quantita), 0);
        }

        function dataScadenzaPiuVicina(item) {
            if (!item.lotti || item.lotti.length === 0) return '9999-12-31';
            const dateSorted = item.lotti.map(l => l.scadenza).sort();
            return dateSorted[0];
        }

        function aggiornaUI() {
            localStorage.setItem('dispensa_pasta', JSON.stringify(dispensa));

            const searchQuery = document.getElementById('searchBar').value.toLowerCase();

            // Calcolo totale pacchi complessivi in tutta la dispensa
            const totalePacchi = dispensa.reduce((acc, item) => acc + calcolaTotalePacchi(item), 0);
            countPacchiSpan.textContent = totalePacchi;

            pastaList.innerHTML = '';

            let filtrati = dispensa.map((item, originalIndex) => ({ ...item, originalIndex })).filter(item => {
                const matchTab = currentTab === 'tutti' 
                    || (currentTab === 'integrale' && item.integrale) 
                    || (currentTab === 'standard' && !item.integrale);

                const matchSearch = item.tipo.toLowerCase().includes(searchQuery) 
                    || item.marca.toLowerCase().includes(searchQuery);

                return matchTab && matchSearch;
            });

            if (filtrati.length === 0) {
                pastaList.innerHTML = `<p class="text-slate-500 italic col-span-2 text-center py-6">Nessun pacco di pasta trovato.</p>`;
                return;
            }

            // Ordina le schede in base alla prima data di scadenza più imminente
            filtrati.sort((a, b) => new Date(dataScadenzaPiuVicina(a)) - new Date(dataScadenzaPiuVicina(b)));

            const oggi = new Date().toISOString().split('T')[0];

            filtrati.forEach((item) => {
                const haScadenzeCritiche = item.lotti.some(l => l.scadenza <= oggi);

                // Ordina i lotti interni per scadenza
                item.lotti.sort((a, b) => new Date(a.scadenza) - new Date(b.scadenza));

                const card = document.createElement('div');
                card.className = `bg-white rounded-xl shadow border overflow-hidden flex flex-col justify-between ${haScadenzeCritiche ? 'border-red-400 bg-red-50/50' : 'border-amber-100'}`;

                let lottiHTML = item.lotti.map((lotto, lottoIndex) => {
                    const inScadenza = lotto.scadenza <= oggi;
                    return `
                        <div class="flex items-center justify-between bg-amber-50/80 p-2 rounded-lg text-xs border ${inScadenza ? 'border-red-300 bg-red-100/80' : 'border-amber-200'}">
                            <div>
                                <span class="font-bold ${inScadenza ? 'text-red-700' : 'text-slate-700'}">📅 ${formattaData(lotto.scadenza)}</span>
                                ${inScadenza ? `<span class="block text-[10px] font-extrabold text-red-600">IN SCADENZA!</span>` : ''}
                            </div>
                            <div class="flex items-center gap-1.5">
                                <button onclick="modificaQuantitaLotto(${item.originalIndex}, ${lottoIndex}, -1)" class="w-6 h-6 bg-amber-200 hover:bg-amber-300 font-bold text-slate-800 rounded flex items-center justify-center">-</button>
                                <span class="font-bold text-amber-900 px-1 text-sm">${lotto.quantita}</span>
                                <button onclick="modificaQuantitaLotto(${item.originalIndex}, ${lottoIndex}, 1)" class="w-6 h-6 bg-amber-200 hover:bg-amber-300 font-bold text-slate-800 rounded flex items-center justify-center">+</button>
                            </div>
                        </div>
                    `;
                }).join('');

                card.innerHTML = `
                    <div>
                        <div class="h-36 bg-slate-100 overflow-hidden relative">
                            ${item.foto 
                                ? `<img src="${item.foto}" alt="${item.tipo}" class="w-full h-full object-cover">` 
                                : `<div class="w-full h-full flex items-center justify-center text-4xl bg-amber-100">🍝</div>`
                            }
                            ${item.integrale ? `<span class="absolute top-2 right-2 bg-emerald-700 text-white text-xs font-bold px-2.5 py-1 rounded-full shadow">🌾 Integrale</span>` : ''}
                        </div>
                        <div class="p-4">
                            <div class="flex justify-between items-start mb-1">
                                <h3 class="font-bold text-lg text-slate-800 capitalize leading-tight">${item.tipo}</h3>
                                <button onclick="preparaModifica(${item.originalIndex})" class="text-xs text-amber-700 hover:text-amber-900 font-bold bg-amber-100 px-2 py-1 rounded">✏️ Modifica</button>
                            </div>
                            <p class="text-sm font-semibold text-amber-700 mb-3">${item.marca} (${calcolaTotalePacchi(item)} pacchi)</p>
                            
                            <!-- LISTA LOTTI E SCADENZE -->
                            <div class="space-y-1.5 mb-3">
                                ${lottiHTML}
                            </div>

                            <button onclick="aggiungiNuovoLottoRapido(${item.originalIndex})" class="w-full py-1.5 px-2 bg-amber-100 hover:bg-amber-200 text-amber-800 text-xs font-bold rounded-lg border border-amber-300 border-dashed transition flex items-center justify-center gap-1">
                                ➕ Aggiungi un altro lotto/scadenza
                            </button>
                        </div>
                    </div>
                    <div class="p-4 pt-0">
                        <button onclick="rimuoviPasta(${item.originalIndex})" class="w-full mt-2 bg-red-100 hover:bg-red-200 text-red-700 text-xs font-bold py-2 rounded-lg transition">
                            Elimina Scheda
                        </button>
                    </div>
                `;

                pastaList.appendChild(card);
            });
        }

        function modificaQuantitaLotto(pastaIndex, lottoIndex, delta) {
            dispensa[pastaIndex].lotti[lottoIndex].quantita += delta;

            if (dispensa[pastaIndex].lotti[lottoIndex].quantita <= 0) {
                dispensa[pastaIndex].lotti.splice(lottoIndex, 1);
            }

            if (dispensa[pastaIndex].lotti.length === 0) {
                dispensa.splice(pastaIndex, 1);
            }

            aggiornaUI();
        }

        function aggiungiNuovoLottoRapido(pastaIndex) {
            const dataScadenza = prompt(`Inserisci la nuova data di scadenza per ${dispensa[pastaIndex].tipo} ${dispensa[pastaIndex].marca} (AAAA-MM-GG):`);
            if (!dataScadenza) return;

            const qtaStr = prompt("Quanti pacchi con questa data vuoi aggiungere?", "1");
            const qta = parseInt(qtaStr);
            if (isNaN(qta) || qta <= 0) return;

            // Controlla se esiste già un lotto con la stessa data
            const lottoEsistente = dispensa[pastaIndex].lotti.find(l => l.scadenza === dataScadenza);
            if (lottoEsistente) {
                lottoEsistente.quantita += qta;
            } else {
                dispensa[pastaIndex].lotti.push({ scadenza: dataScadenza, quantita: qta });
            }

            aggiornaUI();
        }

        function preparaModifica(index) {
            const item = dispensa[index];
            document.getElementById('tipo').value = item.tipo;
            document.getElementById('marca').value = item.marca;
            document.getElementById('quantita').value = item.lotti[0]?.quantita || 1;
            document.getElementById('scadenza').value = item.lotti[0]?.scadenza || '';
            document.getElementById('integrale').checked = item.integrale;
            editIndexInput.value = index;

            formTitle.textContent = "Modifica Pasta";
            submitBtn.textContent = "Salva Modifiche";
            cancelEditBtn.classList.remove('hidden');

            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function annullaModifica() {
            pastaForm.reset();
            editIndexInput.value = "-1";
            formTitle.textContent = "Aggiungi Pasta";
            submitBtn.textContent = "Aggiungi alla Dispensa";
            cancelEditBtn.classList.add('hidden');
        }

        pastaForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const index = parseInt(editIndexInput.value);
            const tipoVal = document.getElementById('tipo').value.trim();
            const marcaVal = document.getElementById('marca').value.trim();
            const qtaVal = Number(document.getElementById('quantita').value);
            const scadenzaVal = document.getElementById('scadenza').value;
            const integraleVal = document.getElementById('integrale').checked;
            const fileFoto = document.getElementById('foto').files[0];

            let fotoBase64 = null;
            if (fileFoto) {
                fotoBase64 = await processaFoto(fileFoto);
            } else if (index !== -1) {
                fotoBase64 = dispensa[index].foto;
            }

            if (index === -1) {
                // Cerca se esiste già la stessa pasta (stesso tipo, marca e flag integrale)
                const pastaEsistente = dispensa.find(p => 
                    p.tipo.toLowerCase() === tipoVal.toLowerCase() && 
                    p.marca.toLowerCase() === marcaVal.toLowerCase() && 
                    p.integrale === integraleVal
                );

                if (pastaEsistente) {
                    if (fotoBase64) pastaEsistente.foto = fotoBase64;
                    const lottoStessaData = pastaEsistente.lotti.find(l => l.scadenza === scadenzaVal);
                    if (lottoStessaData) {
                        lottoStessaData.quantita += qtaVal;
                    } else {
                        pastaEsistente.lotti.push({ scadenza: scadenzaVal, quantita: qtaVal });
                    }
                } else {
                    dispensa.push({
                        tipo: tipoVal,
                        marca: marcaVal,
                        integrale: integraleVal,
                        foto: fotoBase64,
                        lotti: [{ scadenza: scadenzaVal, quantita: qtaVal }]
                    });
                }
            } else {
                dispensa[index].tipo = tipoVal;
                dispensa[index].marca = marcaVal;
                dispensa[index].integrale = integraleVal;
                dispensa[index].foto = fotoBase64;
                dispensa[index].lotti[0] = { scadenza: scadenzaVal, quantita: qtaVal };
            }

            annullaModifica();
            aggiornaUI();
        });

        function esportaBackup() {
            if (dispensa.length === 0) {
                alert("La dispensa è vuota! Non ci sono dati da esportare.");
                return;
            }
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(dispensa, null, 2));
            const downloadAnchor = document.createElement('a');
            const dataOggi = new Date().toISOString().split('T')[0];
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `backup_dispensa_pasta_${dataOggi}.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        function importaBackup(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const datiImportati = JSON.parse(e.target.result);
                    if (Array.isArray(datiImportati)) {
                        if (confirm("Vuoi sostituire o unire i dati attuali?\n\n- OK: Sostituisci\n- Annulla: Unisci")) {
                            dispensa = datiImportati;
                        } else {
                            dispensa = [...dispensa, ...datiImportati];
                        }
                        aggiornaUI();
                        alert("Backup ripristinato con successo!");
                    } else {
                        alert("File di backup non valido.");
                    }
                } catch (err) {
                    alert("Errore nella lettura del file JSON.");
                }
            };
            reader.readAsText(file);
            event.target.value = '';
        }

        function processaFoto(file) {
            return new Promise((resolve, reject) => {
                if (!file) resolve(null);
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result);
                reader.onerror = error => reject(error);
            });
        }

        function formattaData(stringaData) {
            if (!stringaData) return '';
            const d = new Date(stringaData);
            return d.toLocaleDateString('it-IT');
        }

        function rimuoviPasta(index) {
            if (confirm("Vuoi davvero rimuovere questa pasta e tutti i suoi lotti dalla dispensa?")) {
                dispensa.splice(index, 1);
                aggiornaUI();
            }
        }

        aggiornaUI();
    </script>
</body>
</html>
